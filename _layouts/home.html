---
layout: compress
---

{% include base_path %}

<!doctype html>
<html lang="{{ page.lang | default: site.locale | slice: 0,2 }}" class="no-js"{% if site.site_theme == "dark" %} data-theme="dark"{% endif %}>
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body class="home-page" data-base-path="{{ base_path }}" data-site-version="{{ site.github.build_revision | default: site.time | date: "%s" }}">
    {% include browser-upgrade.html %}
    {% include masthead.html %}

    <div class="prism-interactive-bg" aria-hidden="true">
      <span class="prism-bg-spot prism-bg-spot--one"></span>
      <span class="prism-bg-spot prism-bg-spot--two"></span>
    </div>

    <main class="home-shell" role="main">
      {{ content }}
    </main>

    <div id="waifu" aria-hidden="true">
      <div id="waifu-message"></div>
      <canvas id="live2d2"></canvas>
      <canvas id="live2d4"></canvas>
      <div class="waifu-tool">
        <span class="icon-next"></span>
        <span class="icon-message"></span>
        <span class="icon-camera"></span>
        <span class="icon-home"></span>
        <span class="icon-about"></span>
        <span class="icon-cross"></span>
        <span class="icon-volumeup"></span>
        <span class="icon-volumedown"></span>
      </div>
    </div>

    <div class="page__footer">
      <footer>
        {% include footer/custom.html %}
        {% include footer.html %}
      </footer>
    </div>

    {% include scripts.html %}
  </body>
</html>
