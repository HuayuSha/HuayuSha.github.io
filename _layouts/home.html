---
layout: compress
---

{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" class="no-js"{% if site.site_theme == "dark" %} data-theme="dark"{% endif %}>
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body class="home-page" data-base-path="{{ base_path }}" data-site-version="{{ site.github.build_revision | default: site.time | date: "%s" }}">
    {% include browser-upgrade.html %}
    {% include masthead.html %}

    <div class="prism-interactive-bg" aria-hidden="true">
      <span class="prism-bg-spot prism-bg-spot--one"></span>
      <span class="prism-bg-spot prism-bg-spot--two"></span>
    </div>

    <main class="home-shell" role="main">
      {{ content }}
    </main>

    <canvas id="prism-live2d-canvas" aria-hidden="true"></canvas>

    <div class="page__footer">
      <footer>
        {% include footer/custom.html %}
        {% include footer.html %}
      </footer>
    </div>

    {% include scripts.html %}
  </body>
</html>
