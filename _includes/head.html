{% include base_path %}
{% assign asset_version = site.github.build_revision | default: site.time | date: "%s" %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<!-- http://t.co/dKP3o1e -->
<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="320">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  (function () {
    var root = document.documentElement;
    root.className = root.className.replace(/\bno-js\b/g, '') + ' js ';
    try {
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        root.classList.add('site-intro-pending');
        window.setTimeout(function () {
          root.classList.remove('site-intro-pending');
        }, 2800);
      }
    } catch (e) {
      root.classList.add('site-intro-pending');
      window.setTimeout(function () {
        root.classList.remove('site-intro-pending');
      }, 2800);
    }
  })();
</script>

<!-- Google Fonts: preconnect + async load -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap"></noscript>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css?v={{ asset_version }}">

<meta http-equiv="cleartype" content="on">
